name: pico-manager
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pico_esp32_server
      MYSQL_USER: pico
      MYSQL_PASSWORD: ${PICO_DB_PASSWORD:?Set PICO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PICO_DB_ROOT_PASSWORD:?Set PICO_DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u pico pico_esp32_server -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${PICO_REDIS_PASSWORD:?Set PICO_REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.api
    restart: unless-stopped
    environment:
      PICO_ADMIN_USERNAME: ${PICO_ADMIN_USERNAME:-}
      PICO_ADMIN_PASSWORD: ${PICO_ADMIN_PASSWORD:-}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8002
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://mysql:3306/pico_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_DRUID_USERNAME: pico
      SPRING_DATASOURCE_DRUID_PASSWORD: ${PICO_DB_PASSWORD:?Set PICO_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${PICO_REDIS_PASSWORD:?Set PICO_REDIS_PASSWORD}
      KNIFE4J_ENABLE: 'false'
      SPRINGDOC_API_DOCS_ENABLED: 'false'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -Djava.awt.headless=true
    volumes:
      - api-data:/app/uploadfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  pico-server:
    build:
      context: ../..
      dockerfile: Dockerfile-server
      args:
        BASE_IMAGE: pico-esp32-server-base:local
    image: pico-esp32-server-server:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8003:8003"
    volumes:
      # 源码热挂载（只读）：直接改 Mac 上的文件，restart 即生效，无需重建镜像。
      # 只读是有意的——容器不该能改你的源码；可写路径在下面单独放行。
      - ../../main/pico-server:/opt/pico-esp32-server:ro
      # 运行时可写目录（记忆、日志、ASR/TTS 输出）
      - ../../main/pico-server/data:/opt/pico-esp32-server/data
      # 容器专用配置：只改 LLM 网关为 host.docker.internal，其余与 data/.config.yaml 一致
      - ../../main/pico-server/data/.config.docker.yaml:/opt/pico-esp32-server/data/.config.yaml:ro
      - ../../main/pico-server/models:/opt/pico-esp32-server/models
      - ../../main/pico-server/tmp:/opt/pico-esp32-server/tmp
      - ../../main/pico-server/music:/opt/pico-esp32-server/music:ro
    security_opt:
      - seccomp:unconfined
    networks: [default]
  firmware-builder:
    build:
      context: /Users/shengzhoukong/Documents/pico/pico-esp32
      dockerfile: docker/firmware-builder/Dockerfile
      # Stamped into the image as its revision for traceability.
      args:
        FIRMWARE_SOURCE_REVISION: ${PICO_FIRMWARE_REVISION:-unknown}
    restart: unless-stopped
    environment:
      FIRMWARE_BUILDER_MODE: server
      FIRMWARE_SOURCE_DIR: /opt/xiaozhi-esp32
      FIRMWARE_OUTPUT_DIR: /output
      FIRMWARE_BUILDER_PORT: 8090
      # Recorded alongside the firmware source fingerprint in the build cache
      # key. The fingerprint tracks working-tree edits automatically, so this
      # value no longer has to be bumped by hand for a rebuild to be picked up;
      # it still separates two checkouts with identical contents.
      FIRMWARE_SOURCE_REVISION: ${PICO_FIRMWARE_REVISION:-unknown}
      HTTP_PROXY: ${PICO_BUILDER_HTTP_PROXY:-}
      HTTPS_PROXY: ${PICO_BUILDER_HTTPS_PROXY:-}
      ALL_PROXY: ${PICO_BUILDER_ALL_PROXY:-}
    expose:
      - "8090"
    volumes:
      - ${PICO_FIRMWARE_OUTPUT_HOST:-/Users/shengzhoukong/Documents/pico/pico-esp32-server/.runtime/firmware-builds}:/output
      # Source hot-mount (read-only), mirroring how pico-server is mounted.
      # Firmware edits then take effect on restart without rebuilding the
      # multi-GB ESP-IDF image. The board tree carries the hardware fixes and
      # docker/firmware-builder carries the builder service itself.
      - /Users/shengzhoukong/Documents/pico/pico-esp32/main/boards/folotoy/ai-passport:/opt/xiaozhi-esp32/main/boards/folotoy/ai-passport:ro
      - /Users/shengzhoukong/Documents/pico/pico-esp32/docker/firmware-builder:/opt/xiaozhi-esp32/docker/firmware-builder:ro
      # ESP-IDF downloads ~60 managed components on first build. Without this the
      # whole set is wiped whenever the container is recreated, forcing every
      # rebuild to re-download hundreds of MB before it can compile anything.
      - ${PICO_FIRMWARE_COMPONENTS_HOST:-/Users/shengzhoukong/Documents/pico/pico-esp32-server/.runtime/firmware-components}:/opt/xiaozhi-esp32/managed_components
    networks: [default]
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '${PICO_MANAGER_BIND:-127.0.0.1}:8002:8002'
    volumes:
      - ../../main/manager-web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
volumes:
  mysql-data:
  redis-data:
  api-data:
