# Single-admin installation: global login budget, independent of spoofed IP headers.
# Empty map keys are not counted. $uri is normalized by nginx before matching.
map $uri $pico_login_key {
    default "";
    "~*^/pico(?:;[^/]*)?/user(?:;[^/]*)?/login(?:[;/]|$)" pico-admin;
}
limit_req_zone $pico_login_key zone=pico_login:1m rate=5r/m;
limit_req_zone $server_name zone=pico_api:1m rate=20r/s;

server {
    listen 8002;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Hashed bundles can be cached safely; the build already emits matching .gz files.
    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg|webp|ico)$ {
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }
    # HTML and the service worker must revalidate after each deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    # The generator is a separately built bundle; its entry HTML must revalidate so
    # a new content-hashed asset is always picked up. Its JS/CSS are hashed and
    # stay long-cacheable above.
    location = /generator/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Defense in depth: browser ingress must never reach service-secret or diagnostic APIs.
    location ^~ /pico/config { return 404; }
    location ^~ /pico/device/address-book/call { return 404; }
    location ^~ /pico/agent/chat-history/report { return 404; }
    location ^~ /pico/agent/chat-summary { return 404; }
    location ^~ /pico/agent/chat-title { return 404; }
    location ^~ /pico/druid { return 404; }
    location ^~ /pico/actuator { return 404; }
    location ^~ /pico/v3/api-docs { return 404; }
    location ^~ /pico/doc.html { return 404; }
    location ^~ /pico/swagger { return 404; }
    location ^~ /pico/webjars { return 404; }
    location /pico/ {
        limit_req zone=pico_login burst=4 nodelay;
        limit_req zone=pico_api burst=40 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
